causes:
  - id: limited_shoulder_flexion_mobility
    category: mobility
    label: Limited overhead shoulder range (lats / teres major short) (PLACEHOLDER)
    structures:
      muscles: [latissimus_dorsi, teres_major]
      joints: [glenohumeral]
    screeningTest: lat_length_test
    baseline: 0.05
    patterns:
      - all: [lumbar_hyperextension, incomplete_top_rom]
        weight: 0.75
      - all: [lumbar_hyperextension]
        weight: 0.35
      - all: [incomplete_top_rom]
        weight: 0.3

  - id: limited_thoracic_extension
    category: mobility
    label: Stiff upper back limits overhead reach (PLACEHOLDER)
    structures:
      muscles: []
      joints: [thoracic_spine]
    screeningTest: thoracic_extension_screen
    baseline: 0.05
    patterns:
      - all: [lumbar_hyperextension, forward_head]
        weight: 0.6
      - all: [lumbar_hyperextension]
        weight: 0.25
      - all: [forward_head]
        weight: 0.25

  - id: poor_scapular_depression_control
    category: motor_control
    label: Poor control of shoulder-blade depression (lower trap under-active, upper trap dominant) (PLACEHOLDER)
    structures:
      muscles: [lower_trapezius, upper_trapezius]
      joints: [scapulothoracic]
    screeningTest: scapular_depression_hold
    baseline: 0.05
    patterns:
      - all: [shoulder_elevation]
        weight: 0.55
      - all: [shoulder_elevation, forward_head]
        weight: 0.3

  - id: load_exceeds_capacity
    category: technique
    label: Load is too heavy for clean reps, so momentum and body English take over (PLACEHOLDER)
    structures:
      muscles: [latissimus_dorsi]
      joints: []
    screeningTest: reduced_load_retest
    baseline: 0.1
    patterns:
      - all: [excessive_torso_lean, shoulder_elevation]
        weight: 0.7
      - all: [excessive_torso_lean]
        weight: 0.45
      - all: [asymmetric_pull]
        weight: 0.15

  - id: tight_pec_minor
    category: mobility
    label: Short pec minor pulls the shoulders forward at the bottom (PLACEHOLDER)
    structures:
      muscles: [pectoralis_minor]
      joints: [scapulothoracic, glenohumeral]
    screeningTest: pec_minor_length_test
    baseline: 0.05
    patterns:
      - all: [humeral_anterior_glide]
        weight: 0.5
      - all: [humeral_anterior_glide, forward_head]
        weight: 0.3

  - id: side_to_side_asymmetry
    category: strength
    label: One side's lats are weaker or less mobile than the other (PLACEHOLDER)
    structures:
      muscles: [latissimus_dorsi]
      joints: [glenohumeral]
    screeningTest: unilateral_flexion_comparison
    baseline: 0.05
    patterns:
      - all: [asymmetric_pull]
        weight: 0.55

  - id: machine_setup
    category: equipment
    label: Seat or thigh pad set-up lets the body move or blocks full reach (PLACEHOLDER)
    structures:
      muscles: []
      joints: []
    screeningTest: setup_check
    baseline: 0.05
    patterns:
      - all: [excessive_torso_lean]
        weight: 0.2
      - all: [incomplete_top_rom]
        weight: 0.2
