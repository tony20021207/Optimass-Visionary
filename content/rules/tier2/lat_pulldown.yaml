# Tier 2 (M6b) root-cause mappings for the lat pulldown.
#
# DRAFT FOR TONY TO REVIEW. Every clinical mapping, weight and screening test below is a
# PLACEHOLDER written to exercise the engine. None of it is a confirmed clinical reference.
# Edit this file freely; the engine in packages/diagnostics/src/tier2 reads it and validates it with Zod.
#
# How the engine scores a cause (see packages/diagnostics/src/tier2/infer.ts):
#   - A pattern matches when every error code in `all` is present among the clip's Tier 1 findings.
#   - Pattern strength = weight x severityMultiplier[worst matched severity] x mean confidence of matched findings.
#   - likelihood = 1 - (1 - baseline) x product over matched patterns of (1 - strength)   (noisy-OR)
#   - Only causes with at least one matched pattern become hypotheses.
#   - Rank: likelihood (high first), then number of findings explained, then order in this file.
#   So give combined patterns (e.g. two errors seen together) a higher weight than either error alone
#   when the combination points more strongly at one cause.

version: "0.1.0-placeholder"
exerciseId: lat_pulldown

# Worst-severity multiplier applied to a matched pattern. PLACEHOLDER values.
severityMultiplier:
  minor: 0.6
  moderate: 0.8
  major: 1.0

# Tier 1 error codes Tier 2 understands for this lift. The Tier 1 rules (vision lane) must emit these
# exact `errorCode` slugs. `view` is the camera view the Tier 1 rule is expected to need (informational here).
errorCodes:
  lumbar_hyperextension:
    label: Lower back arches as the arms reach overhead
    view: sagittal
  incomplete_top_rom:
    label: Arms don't reach full overhead extension at the top of the rep
    view: sagittal
  excessive_torso_lean:
    label: Torso leans back past the set-up angle during the pull
    view: sagittal
  forward_head:
    label: Head pokes forward during the pull
    view: sagittal
  shoulder_elevation:
    label: Shoulders shrug toward the ears during the pull
    view: frontal
  humeral_anterior_glide:
    label: Shoulders roll forward as the elbows pass behind the torso at the bottom
    view: sagittal
  asymmetric_pull:
    label: One side pulls lower or faster than the other
    view: frontal

